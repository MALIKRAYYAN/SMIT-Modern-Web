<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <center><h1>Registration Form</h1></center>
    <hr>
    
    <form>
        
        <h1>Personal Information</h1>

        <label for="name">Full Name:</label>
        <input type="text" name="Name" placeholder="Enter your full name" size="15" required="required">
        <br>
        <br>
        <label for="email">Email:</label>
        <input type="email" name="email" placeholder="Enter you email (example@.com)" size="28" required="required" >
        <br>
        <br>
        <label for="Phone Number">Phone Number:</label>
        <input type="tel" name="Phone Number" id="" placeholder="Enter your phone number" required="required">
        <br>
        <br>
        <label for="D.O.B">Date of birth</label>
        <input type="date" name="D.O.B" id="" required="required">

        <h1>Account Security</h1>

        <label for="username">Username</label>
        <input type="text" name="Username" id="" placeholder="Enter your username" size="15" required="required">
        <br>
        <br>
        <label for="password">Password</label>
        <input type="password" name="password" id="" placeholder="Enter your password" size="15" required="required">
        <br>
        <br>
        <input type="submit" name="Registration form" id="">

    </form>


</body>
</html>
